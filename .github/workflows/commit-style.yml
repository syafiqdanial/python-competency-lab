name: Commit style

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commit-style:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate latest commit subject
        run: python scripts/check_commit_message.py
